# Monorepo toolchain: rwork (dev place sync) + rojo/darklua it shells to,
# pesde (workspace installs) + wally (publishing), rodeo for headless checks.
[env]
_.file = ".env"

[tools]
stylua = "latest"
"ubi:Kampfkarren/selene" = "latest"
"ubi:rojo-rbx/rojo" = "7.7.0"
"ubi:pesde-pkg/pesde" = "latest"
"ubi:UpliftGames/wally" = "v0.3.2"
"ubi:revvy02/darklua" = "v0.19.1"
"ubi:rodeo-rbx/rodeo" = "v1.5.0-rc.11"
"ubi:revvy02/rwork" = "v0.12.0"

[tasks.install]
description = "Install all workspace members (pesde)"
run = "pesde install"

[tasks.dev]
description = "Build + open the dev place, then live-sync (rwork)"
run = "rwork dev"

[tasks.bench]
description = "Benchmark the bench/ fixtures in a fresh Studio (bench/README.md)"
usage = '''
arg "[label]" default="latest" help="results file: bench/results/<label>.json"
flag "--baseline <file>" help="saved results to compare against"
'''
run = '''
set -e
mkdir -p .rodeo/.temp bench/results
rojo build dev.project.json -o .rodeo/.temp/bench.rbxl
rodeo run bench/run.luau --place .rodeo/.temp/bench.rbxl --return "bench/results/${usage_label}.json" -- ${usage_baseline:+--baseline "$usage_baseline"}
'''

[tasks.bench-ab]
description = "A/B the working tree against a git ref, interleaved in one Studio session (bench/README.md)"
usage = '''
arg "[ref]" default="HEAD" help="baseline commit"
flag "--label <label>" default="ab-latest" help="results file: bench/results/<label>.json"
flag "--baseline-retained-scope <dir>" help="retained-scope src for the baseline (default: a copy of the candidate's)"
'''
run = '''
set -e
rm -rf .rodeo/.temp/ab-baseline
mkdir -p .rodeo/.temp/ab-baseline bench/results
git archive "${usage_ref}" -- miu/src miu-wind/src miu-transition/src miu-px/src | tar -x -C .rodeo/.temp/ab-baseline
rojo build dev.project.json -o .rodeo/.temp/bench.rbxl
rodeo run bench/run.luau --place .rodeo/.temp/bench.rbxl --return "bench/results/${usage_label}.json" -- --ab .rodeo/.temp/ab-baseline --ab-ref "$(git rev-parse --short "${usage_ref}")" ${usage_baseline_retained_scope:+--ab-retained-scope "$usage_baseline_retained_scope"}
'''
